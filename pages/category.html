<div class="cat-header-wrap">
    <div class="cat-breadcrumb">
        <a href="#home" class="spa" data-view="home">Home</a> / <span id="cat-breadcrumb-curr">Collections</span>
    </div>
    <h1 class="cat-header" id="cat-title">All Clothing</h1>
    <p class="cat-subtitle" id="cat-subtitle">Carefully curated modest fashion pieces designed in Paris</p>
</div>

<!-- Filter & Sort Bar -->
<div class="cat-filters">
    <div class="cat-filters-left">
        <span class="cat-filter-btn active" data-filter="all" onclick="filterCategory('all')">All</span>
        <span class="cat-filter-btn" data-filter="dresses" onclick="filterCategory('dresses')">Abayas &amp; Dresses</span>
        <span class="cat-filter-btn" data-filter="hijab" onclick="filterCategory('hijab')">Hijab Bar</span>
        <span class="cat-filter-btn" data-filter="set-two-pieces" onclick="filterCategory('set-two-pieces')">Two-Piece Sets</span>
        <span class="cat-filter-btn" data-filter="top" onclick="filterCategory('top')">Oversized Tops</span>
        <span class="cat-filter-btn" data-filter="burkini" onclick="filterCategory('burkini')">Burkini</span>
        <span class="cat-filter-btn" data-filter="prayer-set" onclick="filterCategory('prayer-set')">Prayer Sets</span>
    </div>
    <div class="cat-filters-right">
        <select class="sort-select" onchange="handleSort(this.value)">
            <option value="featured">Featured Collection</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="name">Name: A &rarr; Z</option>
        </select>
    </div>
</div>

<!-- Dynamic Product Grid -->
<div class="products-grid" id="products-grid"></div>
